name: Release

# Runs on pushes to the default branch: when gradle.properties carries a version
# that has no matching v-published tag yet, build the jar and publish it as a
# GitHub release for that tag. The datapack ships inside that jar, so there is no
# separate archive to assemble.

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Resolve the version
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          ALPHA_RELEASES: ${{ vars.ALPHA_RELEASES }}
        run: |
          set -euo pipefail

          VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "mod version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          SKIP=false

          # Ask GitHub rather than the local refs: actions/checkout does not
          # fetch tags by default, so a refs/tags probe would never fire and
          # the publish step would collide with the release it is meant to skip.
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists; nothing to release."
            SKIP=true
          fi

          case "$VERSION" in
            *-alpha*|*-beta*)
              if [ "${ALPHA_RELEASES:-false}" != "true" ]; then
                echo "$VERSION is a pre-release and the ALPHA_RELEASES variable is not enabled; skipping."
                SKIP=true
              fi ;;
          esac

          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

      - name: Build the jar
        if: steps.resolve.outputs.skip == 'false'
        run: ./gradlew build --no-daemon --stacktrace

      - name: Publish the release
        if: steps.resolve.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail

          JAR="build/libs/tensura_iaf_growth-$VERSION.jar"
          if [ ! -f "$JAR" ]; then
            echo "::error::Expected $JAR after the build; found:"
            ls -l build/libs
            exit 1
          fi

          NOTES="Tensura - Ice and Fire Growth, version $VERSION.
          Install by dropping the jar into the mods folder of both the client
          and the server - it changes dragon growth timing, which the client
          renders.

          The rebalanced gear, evolution and entity datapack ships inside the jar.

          Random branches require branchingDefaultStrategy = \"weighted_random\" in
          config/gearevolution-common.toml - see the README."

          PRERELEASE=""
          case "$VERSION" in
            *-alpha*|*-beta*) PRERELEASE="--prerelease" ;;
          esac

          gh release create "v$VERSION" "$JAR" \
            --title "v$VERSION" \
            --notes "$NOTES" \
            $PRERELEASE
